<!DOCTYPE html>
<html lang="pl">
<head>
<meta name="robots" content="noindex, nofollow">
<script>window.WF_TEST = true;</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Wycena Fachowca</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikona-192.png">
<link rel="apple-touch-icon" href="ikona-192.png">
<meta name="description" content="Wycena i oferta dla klienta w 2 minuty, prosto z telefonu na budowie. Pomiar pomieszczeń, materiały z zapasem, PDF. Bez abonamentu.">
<style>
:root{--k:#0f766e;--kj:#e6f4f2;--t:#1f2937;--s:#6b7280;--r:#e5e7eb;--b:#fff;--tlo:#f3f4f6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:var(--tlo);font-size:16px}
header.g{position:sticky;top:0;z-index:5;background:var(--k);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
header.g h1{font-size:1.1rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.g button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit}
main{max-width:720px;margin:0 auto;padding:12px 12px 90px}
nav.d{position:fixed;bottom:0;left:0;right:0;background:var(--b);border-top:1px solid var(--r);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav.d a{flex:1;text-align:center;padding:10px 0;color:var(--s);text-decoration:none;font-size:.8rem}
nav.d a b{display:block;font-size:1.25rem}
nav.d a.on{color:var(--k);font-weight:700}
.k{background:var(--b);border:1px solid var(--r);border-radius:14px;padding:14px;margin-bottom:12px}
.k h2{font-size:1rem;margin:0 0 10px}
.zak{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.zak a{flex:none;padding:8px 12px;border-radius:999px;background:var(--b);border:1px solid var(--r);color:var(--t);text-decoration:none;font-size:.9rem}
.zak a.on{background:var(--k);color:#fff;border-color:var(--k)}
label{display:block;font-size:.8rem;color:var(--s);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--r);border-radius:10px;font:inherit;background:#fff;color:var(--t)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--k);border-color:transparent}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.r4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.r2>div,.r3>div,.r4>div{display:flex;flex-direction:column;justify-content:flex-end}
.btn{display:inline-block;padding:11px 14px;border-radius:10px;border:1px solid var(--k);background:#fff;color:var(--k);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.gl{background:var(--k);color:#fff}
.btn.szer{display:block;width:100%;margin-top:10px}
.btn.ma{padding:6px 10px;font-size:.85rem}
.btn.us{border-color:#dc2626;color:#dc2626}
.pasek{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lista .o{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--r);text-decoration:none;color:inherit}
.lista .o:last-child{border:0}
.o small{color:var(--s);display:block}
.kw{font-weight:700;color:var(--k);white-space:nowrap}
.met{font-size:.85rem;color:var(--s);margin-top:6px}
.met b{color:var(--t)}
.poz{border:1px solid var(--r);border-radius:12px;padding:10px;margin-bottom:10px}
.poz .nag{display:flex;gap:8px;align-items:center}
.poz .nag input{font-weight:600}
.wyn{display:flex;justify-content:space-between;font-size:.9rem;margin-top:6px;color:var(--s)}
.wyn b{color:var(--t)}
.suma div{display:flex;justify-content:space-between;padding:4px 0}
.suma .duza{font-size:1.25rem;font-weight:800;color:var(--k);border-top:1px solid var(--r);margin-top:6px;padding-top:8px}
.info{color:var(--s);font-size:.9rem}
.leg{margin:14px 0 4px;padding:10px 12px;border-top:1px solid #ddd;color:var(--s);font-size:.85rem}.leg b{color:#c62828}
.pokf{border-top:1px dashed #cfd8dc;margin-top:10px;padding-top:8px}
.etykb{position:fixed;right:10px;bottom:78px;z-index:50;background:#7c3aed;color:#fff;border:0;border-radius:20px;padding:9px 14px;font-weight:600;box-shadow:0 2px 8px #0003}
body.etyk label,body.etyk h2,body.etyk .info,body.etyk .met,body.etyk summary,body.etyk th,body.etyk .wyn span,body.etyk .chk{outline:1px dashed #7c3aed;outline-offset:2px}
.ost{color:#c62828;font-size:.88rem;font-weight:600}
.chk{display:flex;gap:8px;align-items:center;font-size:.95rem;color:var(--t);margin:8px 0}
.chk input{width:auto}
.demo{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px;font-size:.88rem;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:9;font-size:.9rem}
/* ---- dokument oferty ---- */
.dok{background:#fff;color:#111;padding:22px;border-radius:6px;font-size:13px;line-height:1.45;position:relative;overflow:hidden}
.dok .gora{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.dok .logo{max-height:70px;max-width:180px}
.dok h1{font-size:20px;margin:14px 0 2px;color:var(--k)}
.dok table{width:100%;border-collapse:collapse;margin:10px 0}
.dok th,.dok td{border-bottom:1px solid #ddd;padding:5px 4px;text-align:left;vertical-align:top}
.dok th{font-size:11px;color:#555;text-transform:uppercase}
.dok td.n,.dok th.n{text-align:right;white-space:nowrap}
.dok .sumy{margin-left:auto;width:min(100%,300px)}
.dok .sumy div{display:flex;justify-content:space-between;padding:2px 0}
.dok .sumy .b{font-weight:800;font-size:16px;border-top:2px solid #111;margin-top:4px;padding-top:4px}
.dok .podp{display:flex;justify-content:space-between;gap:30px;margin-top:40px}
.dok .podp div{flex:1;border-top:1px solid #999;padding-top:4px;font-size:11px;color:#555;text-align:center}
.dok .zn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.dok .zn span{transform:rotate(-30deg);font-size:46px;font-weight:900;color:rgba(220,38,38,.13);white-space:nowrap}
.dok .mala{font-size:11px;color:#555}
.fachy{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0}.fk{display:flex;gap:10px;align-items:center;border:1px solid var(--r);border-radius:12px;padding:10px;margin:0;color:var(--t);font-size:.95rem}
.fk input{width:auto}.fk small,.kfn small{display:block;color:var(--s);font-size:.8rem}.ik{font-size:1.5rem;width:34px;text-align:center}
.kf{border:1px solid var(--r);border-radius:12px;padding:10px;margin:8px 0}.kfn{display:flex;gap:10px;align-items:center}.prz{font-style:normal;font-size:.7rem;background:#fef3c7;color:#92400e;border-radius:6px;padding:1px 6px}
details.k summary{cursor:pointer;color:var(--k)}.fach details{margin:6px 0}.fach summary{color:var(--k);font-size:.9rem;cursor:pointer}
@media screen and (max-width:480px){.dok{padding:12px;font-size:11.5px}.dok td.n,.dok th.n{white-space:normal}.dok th,.dok td{padding:4px 2px}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  header.g,nav.d,.nie-druk,.toast{display:none!important}
  main{padding:0;max-width:none}
  .dok{padding:0;border-radius:0}
}
</style>
</head>
<body>
<header class="g"><h1 id="tyt">Wycena Fachowca</h1><span id="hprz"></span></header>
<main id="m"></main>
<nav class="d">
  <a href="#lista" data-n="lista"><b>📄</b>Oferty</a>
  <a href="#nowa" data-n="nowa"><b>＋</b>Nowa</a>
  <a href="#cennik" data-n="cennik"><b>💲</b>Cennik</a>
  <a href="#ustawienia" data-n="ustawienia"><b>⚙</b>Ustawienia</a>
</nav>
<script src="rdzen.js"></script>
<script src="cenniki.js"></script>
<script>
// Wersja testowa Adriana (wdroz.sh wstrzykuje window.WF_TEST tylko do prywatnej kopii): pełna, osobna pamięć
var KLUCZ = window.WF_TEST ? 'wycenaFachowcaTest' : 'wycenaFachowca1';
if (window.WF_TEST && !localStorage.getItem(KLUCZ) && localStorage.getItem('wycenaFachowca1')) localStorage.setItem(KLUCZ, localStorage.getItem('wycenaFachowca1')); // start: kopia ofert z demo
// SHA-256 kodów odblokowujących (sam kod jest w pliku z zakupu)
var KODY = ['201badc6c7fcf70ac77ad3a57b8446ac0338fcc7be718001a16c5ac53c516446'];
var S;
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function pl(v) { return typeof v === 'number' ? String(v).replace('.', ',') : v; }
function dzis() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dataPL(s) { if (!s) return ''; var p = s.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
function plusDni(s, n) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + (+n || 0)); return d.toISOString().slice(0, 10); }
function toast(t) { var e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(function () { e.remove(); }, 2200); }

function nowyStan() {
  return { v: 1, start: false, odblok: false, nr: 0, firma: { nazwa: '', osoba: '', tel: '', email: '', nip: '', adres: '', konto: '', logo: '' },
    ust: { vat: 'zw', waznosc: 14, zaliczka: 30, warunki: 'Cena obejmuje wykonanie prac wymienionych w ofercie. Prace dodatkowe wyceniane osobno po uzgodnieniu z klientem.' },
    fachy: [], cennik: [], katMat: [], oferty: [], ceny: null, cenyDzien: '' };
}
var NAZWA_FACHU = {}; Object.keys(WF_CENNIKI).forEach(function (k) { NAZWA_FACHU[WF_CENNIKI[k].nazwa] = k; });
NAZWA_FACHU['Malarz'] = 'malarz'; NAZWA_FACHU['Prace ogólne'] = 'ogolne';
function wzorMaterialu(nazwa) { var w = null; Object.keys(WF_CENNIKI).forEach(function (k) { WF_CENNIKI[k].materialy.forEach(function (m) { if (m[0] === nazwa && !w) w = { fk: k, m: m }; }); }); return w; }
function wzorPracy(nazwa) { var w = null; Object.keys(WF_CENNIKI).forEach(function (k) { WF_CENNIKI[k].robocizna.forEach(function (r) { if (r[0] === nazwa && !w) w = k; }); }); return w; }
function wczytaj() {
  try { S = JSON.parse(localStorage.getItem(KLUCZ)) || nowyStan(); } catch (e) { S = nowyStan(); }
  if (window.WF_TEST) S.odblok = true;
  // pozycje cennika rozbite na osobne (1.2.8: membrana / kontrłaty / łaty) — stara znika, jeśli nie zmieniałeś jej ceny
  [['Membrana, łaty i kontrłaty', 25, 'dekarz']].forEach(function (u) {
    var przed = (S.cennik || []).length;
    S.cennik = (S.cennik || []).filter(function (x) { return !(x.nazwa === u[0] && String(x.cena) === String(u[1])); });
    if (S.cennik.length < przed && S.fachy) setTimeout(function () { dodajFach(u[2]); zapisz(); }, 0);
  });
  // 1.2.8: prace „na powierzchnię” liczone z obliczeń fachu zamiast wpisywania ręcznie
  [['Hydroizolacja (folia w płynie)', 'gl_pod_m2'], ['Skucie starych płytek', 'gl_razem_m2'], ['Demontaż starej podłogi', 'po_m2'], ['Demontaż starego pokrycia', 'de_m2']].forEach(function (u) {
    (S.cennik || []).forEach(function (x) { if (x.nazwa === u[0] && x.baza === 'reczna') x.baza = u[1]; });
  });
  var n = nowyStan(); Object.keys(n).forEach(function (k) { if (S[k] === undefined) S[k] = n[k]; });
  if (!S.fachy.length) { // wersja 1.0 nie zapisywała fachów: odtwórz z cennika
    var stare = { 'Glazurnik': ['glazurnik'], 'Malarz': ['malarz'], 'Malarz / gładzie': ['malarz'], 'Podłogi i panele': ['podlogi'],
      'Hydraulik / elektryk / ogólne': ['elektryk', 'hydraulik', 'ogolne'], 'Elektryk': ['elektryk'], 'Hydraulik': ['hydraulik'], 'Prace ogólne': ['ogolne'] };
    S.cennik.concat(S.katMat).forEach(function (c) { (stare[c.fach] || []).forEach(function (k) { if (S.fachy.indexOf(k) < 0) S.fachy.push(k); }); });
  }
  if ((S.v || 1) < 2) { // 1.2: przypisz fach do pozycji cennika, kod ceny rynkowej do materiałów
    S.cennik.forEach(function (c) { if (!c.fk) c.fk = wzorPracy(c.nazwa) || NAZWA_FACHU[c.fach] || ''; });
    S.katMat.forEach(function (m) { var w = wzorMaterialu(m.nazwa); if (!m.fk) m.fk = w ? w.fk : (NAZWA_FACHU[m.fach] || '');
      if (w && w.m[6] && !m.kod) { m.kod = w.m[6]; m.ile = w.m[7]; m.auto = WF.liczba(m.cena) === w.m[5]; } });
    S.v = 2;
  }
}
// ---------- ceny rynkowe materiałów (raz dziennie, gdy jest internet) ----------
function zastosujCeny() {
  S.katMat.forEach(function (m) { if (m.kod && m.auto !== false) { var c = WF.cenaRynkowa(S.ceny, m.kod, m.ile); if (c != null) m.cena = c; } });
}
function pobierzCeny() {
  if (!window.fetch || (navigator.onLine === false) || S.cenyDzien === dzis()) return;
  fetch('ceny.json?d=' + dzis(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (!d || !d.ceny) return; S.ceny = d; S.cenyDzien = dzis(); zastosujCeny(); zapisz();
    if ((location.hash || '').indexOf('#cennik') === 0) widokCennik();
  }).catch(function () {});
}
function demoUzyte(k) { return !S.odblok && S.oferty.some(function (o) { return o.fach === k && !o.przyklad; }); }
function fachyOferty(o) { var l = o.fach ? [o.fach] : []; Object.keys(o.obmiary || {}).forEach(function (k) { if (l.indexOf(k) < 0) l.push(k); }); return l; }
function zPokojami(o) { return !o.fach || fachyOferty(o).some(function (k) { return WF_CENNIKI[k] && WF_CENNIKI[k].pokoje; }); }
function zapisz() { try { localStorage.setItem(KLUCZ, JSON.stringify(S)); } catch (e) { toast('Brak miejsca w pamięci telefonu — zmniejsz logo albo usuń stare oferty.'); } }

function dodajFach(klucz) {
  var c = WF_CENNIKI[klucz]; if (!c) return;
  if (S.fachy.indexOf(klucz) < 0) S.fachy.push(klucz);
  c.robocizna.forEach(function (r) {
    if (!S.cennik.some(function (x) { return x.nazwa === r[0] && x.fk === klucz; }))
      S.cennik.push({ id: id(), nazwa: r[0], jedn: r[1], cena: r[2], baza: r[3], fach: c.nazwa, fk: klucz });
  });
  c.materialy.forEach(function (m) {
    if (!S.katMat.some(function (x) { return x.nazwa === m[0] && x.fk === klucz; }))
      S.katMat.push({ id: id(), nazwa: m[0], baza: m[1], zuzycie: m[2], opak: m[3], opis: m[4], cena: m[5], fach: c.nazwa, fk: klucz, kod: m[6] || '', ile: m[7] || 0, auto: !!m[6] });
  });
  if (S.ceny) zastosujCeny();
}

// ---------- router ----------
function idz(h) { if (location.hash === h) pokaz(); else location.hash = h; }
window.addEventListener('hashchange', pokaz);
function pokaz() {
  var h = (location.hash || '#lista').slice(1).split('/');
  [].forEach.call(document.querySelectorAll('nav.d a'), function (a) { a.className = a.dataset.n === h[0] ? 'on' : ''; });
  $('#hprz').innerHTML = '';
  if (!S.start && h[0] !== 'ustawienia') return widokStart();
  if (h[0] === 'nowa') return widokNowa();
  if (h[0] === 'oferta') return widokOferta(h[1], h[2] || 'klient');
  if (h[0] === 'podglad') return widokPodglad(h[1]);
  if (h[0] === 'cennik') return widokCennik();
  if (h[0] === 'ustawienia') return widokUstawienia();
  widokLista();
}
function ustawTytul(t) { $('#tyt').textContent = t; document.title = t + ' — Wycena Fachowca'; window.scrollTo(0, 0); }
function bannerDemo() {
  return S.odblok ? '' : '<div class="demo">Wersja demo: <b>jedna pełna oferta dla każdego fachu</b> i dowolnie wiele przykładów. ' +
    'Pełna wersja bez limitu: <a href="kup.html">kup raz, bez abonamentu</a>, potem wpisz kod w Ustawieniach.</div>';
}

// ---------- start ----------
function widokStart() {
  ustawTytul('Witaj!');
  var h = '<div class="k"><h2>Ustawmy aplikację (30 sekund)</h2><p class="info">Zaznacz, czym się zajmujesz (możesz kilka). Wczytam cennik prac i materiałów dla Twoich fachów — ceny zmienisz potem w zakładce „Cennik”.</p><div class="fachy">';
  Object.keys(WF_CENNIKI).forEach(function (k) { var c = WF_CENNIKI[k]; h += '<label class="fk"><input type="checkbox" value="' + k + '"><span class="ik">' + c.ikona + '</span><span><b>' + esc(c.nazwa) + '</b><small>' + esc(c.opis) + '</small></span></label>'; });
  h += '</div>';
  h += '<label>Nazwa firmy albo imię i nazwisko (na ofercie)</label><input id="sf" placeholder="np. Usługi Remontowe Jan Kowalski">' +
    '<label>Telefon</label><input id="st" type="tel" placeholder="np. 600 100 200">' +
    '<button class="btn gl szer" id="sok">Zaczynamy</button></div>' +
    '<p class="info">Dane zostają tylko w tym telefonie. Bez konta, bez logowania, działa też bez internetu.</p>';
  $('#m').innerHTML = h;
  $('#sok').onclick = function () {
    var z = document.querySelectorAll('#m input[type=checkbox]:checked'); if (!z.length) return toast('Zaznacz przynajmniej jeden fach.');
    [].forEach.call(z, function (c) { dodajFach(c.value); });
    S.firma.nazwa = $('#sf').value.trim(); S.firma.tel = $('#st').value.trim(); S.start = true; zapisz(); idz('#nowa');
  };
}

// ---------- lista ofert ----------
function widokLista() {
  ustawTytul('Oferty');
  var h = bannerDemo() + '<div class="k lista">';
  if (!S.oferty.length) h += '<p class="info">Nie masz jeszcze ofert. Kliknij „＋ Nowa” na dole.</p>';
  S.oferty.slice().reverse().forEach(function (o) {
    var p = WF.podsumowanie(o);
    var f = o.fach && WF_CENNIKI[o.fach];
    h += '<a class="o" href="#oferta/' + o.id + '/klient"><span><b>' + (f ? f.ikona + ' ' : '') + esc(o.tytul || 'Oferta') + (o.przyklad ? ' <i class="prz">PRZYKŁAD</i>' : '') + '</b><small>' + esc(o.nr) + ' · ' +
      esc(o.klient.imie || 'bez klienta') + ' · ' + dataPL(o.data) + (o.status ? ' · ' + esc(o.status) : '') + '</small></span><span class="kw">' + WF.zl(p.brutto) + '</span></a>';
  });
  $('#m').innerHTML = h + '</div>';
}

function kafelFachu(k) {
  var c = WF_CENNIKI[k], uz = demoUzyte(k);
  return '<div class="kf"><div class="kfn"><span class="ik">' + c.ikona + '</span><span><b>' + esc(c.nazwa) + '</b><small>' + esc(c.opis) + '</small></span></div><div class="pasek" style="margin-top:8px">' +
    (uz ? '<a class="btn ma" href="kup.html">Demo wykorzystane — pełna wersja</a>' : '<button class="btn gl ma" data-nowa="' + k + '">+ Nowa oferta</button>') +
    '<button class="btn ma" data-przyk="' + k + '">Zobacz przykład</button></div></div>';
}
function widokNowa() {
  ustawTytul('Nowa oferta');
  var moje = S.fachy.filter(function (k) { return WF_CENNIKI[k]; }), inne = Object.keys(WF_CENNIKI).filter(function (k) { return moje.indexOf(k) < 0; });
  $('#m').innerHTML = bannerDemo() + '<div class="k"><h2>Dla jakiego fachu robisz ofertę?</h2><p class="info">Każdy fach ma swoje pomiary, prace i materiały. „Zobacz przykład” pokaże gotową ofertę w 2 sekundy.</p>' +

    h += '<div class="poz"><div class="nag"><input data-c="cennik.' + i + '.nazwa" value="' + esc(c.nazwa) + '"><button class="btn ma us" data-usc="' + i + '">✕</button></div><div class="r3">' +
      '<div><label>Cena</label><input data-c="cennik.' + i + '.cena" value="' + esc(c.cena) + '"' + NUM + '></div><div><label>J.m.</label><input data-c="cennik.' + i + '.jedn" value="' + esc(c.jedn) + '"></div>' +
      '<div><label>Liczone od</label>' + opcjeBaza('cennik.' + i + '.baza', c.baza, 'data-c', c.fk ? [c.fk] : S.fachy) + '</div></div></div>';
  });
  h += '<button class="btn szer" id="dodC">+ Dodaj pozycję</button></div><div class="k"><h2>Materiały</h2>';
  S.katMat.forEach(function (m, i) {
    h += '<div class="poz"><div class="nag"><input data-c="katMat.' + i + '.nazwa" value="' + esc(m.nazwa) + '"><button class="btn ma us" data-usm="' + i + '">✕</button></div><label>Liczone od</label>' + opcjeBaza('katMat.' + i + '.baza', m.baza, 'data-c', m.fk ? [m.fk] : S.fachy) + rynek(m, i) + '<div class="r2">' +
      '<div><label>' + (m.baza === 'reczna' ? 'Zużycie na 1 szt.' : etZuzycia(m.baza)) + '</label><input data-c="katMat.' + i + '.zuzycie" value="' + esc(pl(m.zuzycie)) + '"' + NUM + '></div><div><label>Ilość w opakowaniu</label><input data-c="katMat.' + i + '.opak" value="' + esc(pl(m.opak)) + '"' + NUM + '></div></div><div class="r2">' +
      '<div><label>Opakowanie</label><input data-c="katMat.' + i + '.opis" value="' + esc(m.opis) + '"></div><div><label>Cena za opakowanie</label><input data-c="katMat.' + i + '.cena" value="' + esc(m.cena) + '"' + NUM + '></div></div></div>';
  });
  h += '<button class="btn szer" id="dodM">+ Dodaj materiał</button></div><div class="k"><h2>Dodaj cennik fachu</h2>' +
    Object.keys(WF_CENNIKI).map(function (k) { return '<button class="btn ma" style="margin:4px" data-fach="' + k + '">' + esc(WF_CENNIKI[k].nazwa) + '</button>'; }).join('') + '</div>';
  $('#m').innerHTML = h;
  [].forEach.call(document.querySelectorAll('[data-c]'), function (el) {
    el.addEventListener('change', function () { ustawPole(S, el.dataset.c, el.value); if (/^katMat\.\d+\.cena$/.test(el.dataset.c)) S.katMat[+el.dataset.c.split('.')[1]].auto = false; var mc = /^cennik\.(\d+)\.baza$/.exec(el.dataset.c); if (mc && el.value !== 'reczna') S.cennik[+mc[1]].jedn = WF.opisBazy(el.value).jedn; zapisz(); if (el.tagName === 'SELECT' || /\.cena$/.test(el.dataset.c)) widokCennik(); });
  });
  [].forEach.call(document.querySelectorAll('[data-usc]'), function (x) { x.onclick = function () { S.cennik.splice(+x.dataset.usc, 1); zapisz(); widokCennik(); }; });
  [].forEach.call(document.querySelectorAll('[data-rynek]'), function (x) { x.onclick = function () { var m = S.katMat[+x.dataset.rynek]; m.auto = true; zastosujCeny(); zapisz(); widokCennik(); toast('Przywrócono cenę rynkową'); }; });
  [].forEach.call(document.querySelectorAll('[data-usm]'), function (x) { x.onclick = function () { S.katMat.splice(+x.dataset.usm, 1); zapisz(); widokCennik(); }; });
  [].forEach.call(document.querySelectorAll('[data-fach]'), function (x) { x.onclick = function () { dodajFach(x.dataset.fach); zapisz(); widokCennik(); toast('Dodano cennik: ' + WF_CENNIKI[x.dataset.fach].nazwa); }; });
  $('#dodC').onclick = function () { S.cennik.push({ id: id(), nazwa: 'Nowa praca', jedn: 'm²', cena: 0, baza: 'podloga' }); zapisz(); widokCennik(); };
  $('#dodM').onclick = function () { S.katMat.push({ id: id(), nazwa: 'Nowy materiał', baza: 'podloga', zuzycie: 1, opak: 1, opis: 'szt.', cena: 0 }); zapisz(); widokCennik(); };
}

// ---------- ustawienia ----------
function sha256(t) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function (b) { return Array.from(new Uint8Array(b)).map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); });
}
function widokUstawienia() {
  ustawTytul('Ustawienia');
  var f = S.firma, u = S.ust;
  var p = function (et, k, typ) { return '<label>' + et + '</label><input data-f="' + k + '" value="' + esc(f[k]) + '"' + (typ ? ' type="' + typ + '"' : '') + '>'; };
  $('#m').innerHTML = '<div class="k"><h2>Pełna wersja</h2>' + (S.odblok ? '<p>✅ Odblokowana. Dziękujemy za zakup!</p>' :
    '<p class="info">Wpisz kod z pliku, który dostałeś po zakupie.</p><input id="kod" placeholder="WF-XXXX-XXXX" autocapitalize="characters"><button class="btn gl szer" id="odb">Odblokuj</button>') + '</div>' +
    '<div class="k"><h2>Twoja firma (na ofercie)</h2>' + p('Nazwa firmy', 'nazwa') + p('Imię i nazwisko', 'osoba') + '<div class="r2">' + p('Telefon', 'tel', 'tel') + p('E-mail', 'email', 'email') + '</div>' +
    '<div class="r2">' + p('NIP', 'nip') + p('Numer konta', 'konto') + '</div>' + p('Adres', 'adres') +
    '<label>Logo (opcjonalnie)</label><input type="file" id="logo" accept="image/*">' + (f.logo ? '<img src="' + f.logo + '" style="max-height:60px;margin-top:6px"><button class="btn ma us" id="bezLogo" style="margin-left:8px">usuń logo</button>' : '') + '</div>' +
    '<div class="k"><h2>Domyślne warunki</h2><div class="r3"><div><label>VAT</label><select data-u="vat">' + [['zw', 'zwolniony'], ['8', '8%'], ['23', '23%']].map(function (v) { return '<option value="' + v[0] + '" ' + (String(u.vat) === v[0] ? 'selected' : '') + '>' + v[1] + '</option>'; }).join('') + '</select></div>' +
    '<div><label>Ważność (dni)</label><input data-u="waznosc" value="' + esc(u.waznosc) + '"' + NUM + '></div><div><label>Zaliczka %</label><input data-u="zaliczka" value="' + esc(u.zaliczka) + '"' + NUM + '></div></div>' +
    '<label>Stały tekst na ofercie</label><textarea data-u="warunki" rows="3">' + esc(u.warunki) + '</textarea>' +
    '<p class="info">VAT 8% dotyczy zwykle remontów w budownictwie mieszkaniowym; sprawdź ze swoją księgową, która stawka Cię dotyczy.</p></div>' +
    '<div class="k"><h2>Kopia zapasowa</h2><p class="info">Dane są tylko w tym telefonie. Zrób kopię raz na jakiś czas.</p><div class="pasek"><button class="btn" id="eksp">Zapisz kopię</button><label class="btn" style="margin:0">Wczytaj kopię<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>' +
    (window.WF_TEST ? '<div class="k"><h2>Moje poprawki tekstów (' + Object.keys(ETYK).length + ')</h2>' +
      (Object.keys(ETYK).length ? '<div class="mala bezleg">' + Object.keys(ETYK).map(function (k) { return '<div>„' + esc(k) + '” → „' + esc(ETYK[k]) + '”</div>'; }).join('') + '</div>' : '<p class="info">Włącz ✏️ Edytuj teksty i stuknij w dowolny opis.</p>') +
      '<div class="pasek" style="margin-top:8px"><button class="btn" id="etykKop">Kopiuj dla Jarvisa</button><button class="btn ma" id="etykCzysc">Wyczyść</button></div></div>' : '') +
    '<p class="info" style="text-align:center">Wycena Fachowca ' + WERSJA_APP + (window.WF_TEST ? ' · <b>WERSJA TESTOWA (pełna)</b>' : '') + ' · MasterSSon</p>';
  [].forEach.call(document.querySelectorAll('[data-f]'), function (el) { el.addEventListener('change', function () { f[el.dataset.f] = el.value.trim(); zapisz(); }); });
  [].forEach.call(document.querySelectorAll('[data-u]'), function (el) { el.addEventListener('change', function () { u[el.dataset.u] = el.value; zapisz(); }); });
  var b;
  if ((b = $('#odb'))) b.onclick = function () {
    var k = $('#kod').value.trim().toUpperCase().replace(/\s/g, '');
    sha256(k).then(function (hsh) { if (KODY.indexOf(hsh) >= 0) { S.odblok = true; zapisz(); toast('Pełna wersja odblokowana!'); widokUstawienia(); } else toast('Nieprawidłowy kod. Sprawdź, czy przepisałeś go dokładnie.'); });
  };
  if ((b = $('#etykKop'))) b.onclick = function () {
    var t = 'Poprawki tekstów Wycena Fachowca ' + WERSJA_APP + ':\n' + Object.keys(ETYK).map(function (k) { return '„' + k + '” → „' + ETYK[k] + '”'; }).join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('Skopiowane — wklej Jarvisowi'); }, function () { prompt('Skopiuj ręcznie:', t); });
  };
  if ((b = $('#etykCzysc'))) b.onclick = function () { if (confirm('Usunąć wszystkie poprawki tekstów?')) { ETYK = {}; localStorage.removeItem(ETYK_KLUCZ); widokUstawienia(); } };
  if ((b = $('#bezLogo'))) b.onclick = function () { f.logo = ''; zapisz(); widokUstawienia(); };
  $('#logo').onchange = function (e) {
    var plik = e.target.files[0]; if (!plik) return;
    var img = new Image(), r = new FileReader();
    r.onload = function () { img.onload = function () { var s = Math.min(1, 360 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); f.logo = c.toDataURL('image/png'); zapisz(); widokUstawienia(); }; img.src = r.result; };
    r.readAsDataURL(plik);
  };
  $('#eksp').onclick = function () {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' }));
    a.download = 'wycena-fachowca-kopia-' + dzis() + '.json'; a.click();
  };
  $('#imp').onchange = function (e) {
    var plik = e.target.files[0]; if (!plik) return; var r = new FileReader();
    r.onload = function () { try { var d = JSON.parse(r.result); if (!d || !d.oferty) throw 0; if (confirm('Zastąpić obecne dane kopią (' + d.oferty.length + ' ofert)?')) { var odb = S.odblok; S = d; S.odblok = S.odblok || odb; zapisz(); toast('Wczytano kopię'); idz('#lista'); } } catch (x) { toast('To nie jest plik kopii Wyceny Fachowca.'); } };
    r.readAsText(plik);
  };
}

wczytaj(); pokaz(); pobierzCeny();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  var swByl = !!navigator.serviceWorker.controller; // nowa wersja przejęła stronę → przeładuj raz, żeby od razu działała
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (swByl && !window.__przeladowano) { window.__przeladowano = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(function (r) { r.update(); }).catch(function () {});
}
